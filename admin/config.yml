backend:
  name: git-gateway
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Prodotti Boutique"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome Capo", name: "title", widget: "string" }
      - { label: "Prezzo (€)", name: "price", widget: "string" }
      - { label: "Foto Prodotto", name: "image", widget: "image" }
      - { label: "Descrizione", name: "body", widget: "markdown", required: false }
